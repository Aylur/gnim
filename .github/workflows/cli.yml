name: Build CLI

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/cli.yml"
            - "Cargo.toml"
            - "Cargo.lock"
            - "packages/cli/**"
    workflow_dispatch:
    workflow_call:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: linux
                      cpu: x64
                      target: x86_64-unknown-linux-musl
                      runner: ubuntu-latest

                    - os: linux
                      cpu: arm64
                      target: aarch64-unknown-linux-musl
                      runner: ubuntu-24.04-arm

                    - os: darwin
                      cpu: x64
                      target: x86_64-apple-darwin
                      runner: macos-latest
                      cross: true

                    - os: darwin
                      cpu: arm64
                      target: aarch64-apple-darwin
                      runner: macos-latest

        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install musl
              if: matrix.os == 'linux'
              run: sudo apt-get update -y && sudo apt-get install -y musl-tools

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              run: cargo build --release --package gnim --target ${{ matrix.target }}

            - name: Smoke test
              if: ${{ !matrix.cross }}
              run: target/${{ matrix.target }}/release/gnim --version

            - name: Upload artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.os }}-${{ matrix.cpu }}
                  path: target/${{ matrix.target }}/release/gnim
                  if-no-files-found: error

